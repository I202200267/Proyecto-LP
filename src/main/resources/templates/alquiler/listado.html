<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" th:replace="layouts/layout :: layoutBase(~{::contenido})">

<div th:fragment="contenido">

	<div class="container mt-4">
		<div class="row mb-3 mt-5 align-items-center">
			<div class="col-md-8">
				<h1 class="m-0">Listado de Alquileres</h1>
				<p class="text-muted mt-1">Historial de transacciones de alquiler de vehículos</p>
			</div>
			<div class="col-md-4 text-end">
				<a th:href="@{/alquiler/nuevo}" class="btn btn-primary">
					<i class="fa-solid fa-plus"></i> Nuevo Alquiler
				</a>
			</div>
		</div>

		<!-- Tabla de Listado de Alquileres -->
		<div class="card shadow-sm">
			<div class="card-body">
				<div class="table-responsive">
					<table id="tblAlquileres" class="table table-striped table-hover align-middle">
						<thead class="table-dark text-center">
							<tr>
								<th>Código</th>
								<th>Fecha</th>
								<th>Cliente</th>
								<th>Atendido por</th>
								<th>Monto Total</th>
								<th>Acciones</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="alquiler : ${lstAlquileres}">
								<td th:text="${alquiler.idAlquiler}" class="text-center"></td>
								<td th:text="${alquiler.fechaAlquiler}" class="text-center"></td>
								<td th:text="${alquiler.cliente != null ? alquiler.cliente.nombres + ' ' + alquiler.cliente.apellidos : 'N/A'}"></td>
								<td th:text="${alquiler.usuario != null ? alquiler.usuario.cuenta : 'N/A'}"></td>
								<td th:text="${alquiler.montoTotal != null ? #numbers.formatCurrency(alquiler.montoTotal) : 'S/ 0.00'}" class="text-end"></td>
								<td class="text-center">
									<!-- Botón para ver el detalle o comprobante si se desea expandir -->
									<button type="button" class="btn btn-info btn-sm text-white" title="Ver Detalle">
										<i class="fa-solid fa-eye"></i>
									</button>
								</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>
	</div>

	<th:block th:utext="${alert}"></th:block>

	<!-- Script de inicialización de DataTables para el listado -->
	<script th:inline="none">
		$(document).ready(function () {
			const idTabla = '#tblAlquileres';
			if ($.fn.DataTable.isDataTable(idTabla)) {
				$(idTabla).DataTable().destroy();
			}
			$(idTabla).DataTable({
				lengthMenu: [5, 10, 20],
				pageLength: 10,
				language: {
					url: 'https://cdn.datatables.net/plug-ins/2.3.4/i18n/es-ES.json',
					search: "Filtrar :"
				},
				order: [[0, "desc"]]
			});
		});
	</script>
</div>

</html>
