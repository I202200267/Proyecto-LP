<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layoutBase(contenido)">

<head>
	<meta charset="UTF-8">
	<title>Sistema de Alquiler de Vehículos</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
	<script src="https://code.jquery.com/jquery-3.7.1.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.21.0/jquery.validate.min.js"></script>

	<!-- DataTables Bootstrap 5 -->
	<link rel="stylesheet" href="https://cdn.datatables.net/2.3.2/css/dataTables.bootstrap5.css">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script src="https://cdn.datatables.net/2.3.2/js/dataTables.js"></script>
	<script src="https://cdn.datatables.net/2.3.2/js/dataTables.bootstrap5.js"></script>

	<link rel="stylesheet" th:href="@{/css/layout.css}">
</head>

<body>
	<!-- Header -->
	<header class="header">
		<div class="container d-flex justify-content-between align-items-center">


			<div class="d-flex align-items-center gap-3">

				<div class="btn-menu mb-0">
					<label for="btn-menu" class="m-0 p-1 d-flex align-items-center">
						<i class="fa-solid fa-bars"></i>
					</label>
				</div>

				<div style="border-left: 1px solid rgba(255, 255, 255, 0.2); height: 24px;"></div>

				<a th:href="@{/home/dashboard}" class="d-flex align-items-center gap-2 text-decoration-none">
					<img th:src="@{/imagenes/logo.jpg}" alt="Moviliza Logo"
						style="height: 35px; width: auto; object-fit: contain;" class="rounded">
					<span class="text-white fw-bold fs-5 tracking-wide m-0">MOVILIZA</span>
				</a>
			</div>

			<div class="text-white d-flex align-items-center gap-2">
				<i class="fa-regular fa-circle-user fs-5 text-secondary"></i>
				<span class="fs-6 m-0 opacity-75">Bienvenido, <strong th:text="${session.FULL_NAME}"
						class="text-white opacity-100">Gustavo Echevarria</strong></span>
			</div>

		</div>
	</header>


	<input type="checkbox" id="btn-menu">

	<div class="container-menu">
		<div class="cont-menu">
			<nav>
				<a th:href="@{/home/dashboard}"><i class="fa-solid fa-house"></i> Inicio</a>
				<a th:href="@{/vehiculo/listado}"><i class="fa-solid fa-car"></i> Vehículos</a>
				<a th:href="@{/cliente/listado}"><i class="fa-solid fa-users"></i> Clientes</a>
				<a th:href="@{/alquiler/listado}"><i class="fa-regular fa-file-lines"></i> Alquileres</a>
				<a href="#" id="cerrar-session"><i class="fa-solid fa-right-from-bracket"></i> Cerrar sesión</a>
			</nav>
			<label for="btn-menu"><i class="fa-solid fa-xmark"></i></label>
		</div>
	</div>

	<main style="padding: 70px;">
		<div class="container mt-5 pt-5 text-white" th:replace="${contenido}">[Contenido aquí]</div>
	</main>
	<script th:src="@{/js/validacion-bootstrap.js}"></script>

	<script th:inline="javascript">
		$("#cerrar-session").on("click", function () {
			Swal.fire({
				title: "¿Deseas cerrar sesión?",
				icon: "warning",
				showCancelButton: true,
				confirmButtonColor: "#3085d6",
				cancelButtonColor: "#d33",
				confirmButtonText: "Sí, cerrar",
				cancelButtonText: "No"
			}).then((result) => {
				if (result.isConfirmed) {
					window.location.href = /*[[@{/cerrar-sesion}]]*/ "";
				}
			});
		});
	</script>

	<th:block th:utext="${alert}"></th:block>
</body>

</html>
