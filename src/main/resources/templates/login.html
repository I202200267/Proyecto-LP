<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Iniciar Sesión - Alquiler de Vehículos</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

	<link rel="stylesheet" th:href="@{/css/login.css}">
</head>

<body class="bg-light d-flex align-items-center py-4" style="height: 100vh;">

	<div class="container">
		<div class="row justify-content-center">
			<div class="col-md-5">
				<div class="card shadow border-0 rounded-3">
					<div class="card-body p-4 p-sm-5">
						<div class="text-center mb-4">
							<i class="fa-solid fa-car fa-3x text-primary mb-3"></i>
							<h3 class="fw-bold">Control de Acceso</h3>
							<p class="text-muted">Sistema de Alquiler de Vehículos</p>
						</div>

						<form th:action="@{/iniciar-sesion}" th:object="${filter}" method="get">
							<div class="mb-3">
								<label for="email" class="form-label">Correo electrónico:</label>
								<div class="input-group">
									<span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
									<input type="email" class="form-control" th:field="*{email}" required
										placeholder="Ingrese su correo">
								</div>
							</div>

							<div class="mb-4">
								<label for="password" class="form-label">Contraseña:</label>
								<div class="input-group">
									<span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
									<input type="password" class="form-control" th:field="*{password}" required
										placeholder="Ingrese su contraseña">
								</div>
							</div>

							<div class="d-grid">
								<button type="submit" class="btn btn-primary btn-lg">
									<i class="fa-solid fa-right-to-bracket me-2"></i>Ingresar
								</button>
							</div>
						</form>
					</div>

					<div class="card-footer text-muted text-center">
						&copy; 2026 Sistema de Alquiler de Vehículos - Todos los derechos reservados
					</div>

				</div>
			</div>
		</div>
	</div>

	<th:block th:utext="${alert}"></th:block>
</body>

</html>
