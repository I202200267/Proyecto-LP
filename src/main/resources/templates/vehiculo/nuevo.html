<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Nuevo Vehículo</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-success text-white">
                        <h4 class="mb-0"><i class="fa-solid fa-car-side me-2"></i>Registrar Nuevo Vehículo</h4>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/vehiculo/registrar}" th:object="${vehiculo}" method="post">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label for="placa" class="form-label font-weight-bold">Placa:</label>
                                    <input type="text" id="placa" th:field="*{placa}" class="form-control" placeholder="Ej. ABC-123" required />
                                </div>
                                <div class="col-md-6">
                                    <label for="categoria" class="form-label">Categoría:</label>
                                    <select id="categoria" th:field="*{categoria.idCategoria}" class="form-select" required>
                                        <option value="">-- Seleccione Categoría --</option>
                                        <option th:each="c : ${lstCategorias}" 
                                                th:value="${c.idCategoria}" 
                                                th:text="${c.nombre}"></option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label for="marca" class="form-label">Marca:</label>
                                    <input type="text" id="marca" th:field="*{marca}" class="form-control" placeholder="Ej. Toyota" required />
                                </div>
                                <div class="col-md-6">
                                    <label for="modelo" class="form-label">Modelo:</label>
                                    <input type="text" id="modelo" th:field="*{modelo}" class="form-control" placeholder="Ej. RAV4" required />
                                </div>
                                <div class="col-md-6">
                                    <label for="precioDiario" class="form-label">Precio Diario (S/):</label>
                                    <input type="number" step="0.01" id="precioDiario" th:field="*{precioDiario}" class="form-control" placeholder="0.00" required />
                                </div>
                            </div>

                            <div class="d-flex justify-content-end gap-2 mt-4">
                                <a th:href="@{/vehiculo/listado}" class="btn btn-secondary">
                                    <i class="fa-solid fa-arrow-left me-1"></i>Cancelar
                                </a>
                                <button type="submit" class="btn btn-success">
                                    <i class="fa-solid fa-floppy-disk me-1"></i>Guardar Vehículo
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
