<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      th:replace="layouts/layout :: layoutBase(~{::contenido})">
<head>
    <meta charset="UTF-8">
    <title>Registrar Vehículo</title>
</head>
<body>

    <div th:fragment="contenido">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                
                
                <div class="card shadow-lg border-0 rounded-3 bg-white bg-opacity-90 my-4">
                    <div class="card-header bg-primary text-white py-3 rounded-top">
                        <h4 class="mb-0 fw-bold text-center">
                            <i class="bi bi-car-front-fill me-2"></i>Registrar Nuevo Vehículo
                        </h4>
                    </div>

                    <div class="card-body p-4">
                        
                        <form th:action="@{/vehiculo/registrar}" th:object="${vehiculo}" method="post">
                            
                          
                            <div class="mb-3">
                                <label for="placa" class="form-label fw-semibold">Placa:</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-card-text"></i></span>
                                    <input type="text" id="placa" th:field="*{placa}" class="form-control" 
                                           placeholder="Ej. ABC-123" required />
                                </div>
                            </div>

                            
                            <div class="mb-3">
                                <label for="categoria" class="form-label fw-semibold">Categoría:</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-tags-fill"></i></span>
                                    <select id="categoria" th:field="*{categoria.idCategoria}" class="form-select" required>
                                        <option value="" disabled selected>-- Seleccione Categoría --</option>
                                        <option th:each="cat : ${lstCategorias}" 
                                                th:value="${cat.idCategoria}" 
                                                th:text="${cat.nombre}">Categoría</option>
                                    </select>
                                </div>
                            </div>

                            
                            <div class="mb-3">
                                <label for="marca" class="form-label fw-semibold">Marca:</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-award-fill"></i></span>
                                    <input type="text" id="marca" th:field="*{marca}" class="form-control" 
                                           placeholder="Ej. Toyota" required />
                                </div>
                            </div>

                            
                            <div class="mb-3">
                                <label for="modelo" class="form-label fw-semibold">Modelo:</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-gear-wide-connected"></i></span>
                                    <input type="text" id="modelo" th:field="*{modelo}" class="form-control" 
                                           placeholder="Ej. RAV4" required />
                                </div>
                            </div>

                           
                            <div class="mb-4">
                                <label for="precioDiario" class="form-label fw-semibold">Precio Diario (S/):</label>
                                <div class="input-group">
                                    <span class="input-group-text">S/</span>
                                    <input type="number" step="0.01" min="0" id="precioDiario" th:field="*{precioDiario}" 
                                           class="form-control" placeholder="0.00" required />
                                </div>
                            </div>

                           
                            <div class="d-flex justify-content-between align-items-center pt-2">
                                <a th:href="@{/vehiculo/listado}" class="btn btn-outline-secondary px-4">
                                    <i class="bi bi-arrow-left me-1"></i> Cancelar
                                </a>
                                <button type="submit" class="btn btn-success px-4">
                                    <i class="bi bi-check-circle me-1"></i> Guardar Vehículo
                                </button>
                            </div>

                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
