<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" th:replace="layouts/layout :: layoutBase(~{::contenido})">

<title>Listado de Vehículos</title>

<div th:fragment="contenido">
	<div class="d-flex justify-content-between align-items-center mb-3">
		<h2><i class="fa-solid fa-car text-primary me-2"></i>Gestión de Vehículos</h2>
		<a th:href="@{/vehiculo/nuevo}" class="btn btn-success">
			<i class="fa-solid fa-plus me-1"></i>Nuevo Vehículo
		</a>
	</div>

	<div class="card shadow-sm">
		<div class="card-body p-0">
			<table class="table table-striped table-hover mb-0 align-middle">
				<thead class="table-dark">
					<tr>
						<th>ID</th>
						<th>Placa</th>
						<th>Marca</th>
						<th>Modelo</th>
						<th>Categoría</th>
						<th>Precio / Día</th>
						<th>Estado</th>
						<th class="text-center">Acciones</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="v : ${lstVehiculos}">
						<td th:text="${v.idVehiculo}">1</td>
						<td class="fw-bold" th:text="${v.placa}">ABC-123</td>
						<td th:text="${v.marca}">Toyota</td>
						<td th:text="${v.modelo}">RAV4</td>
						<td th:text="${v.categoria != null ? v.categoria.nombre : 'S/C'}">SUV</td>
						<td th:text="${'S/ ' + #numbers.formatDecimal(v.precioDiario, 1, 'POINT', 2, 'COMMA')}">S/
							150.00</td>
						<td>
							<span class="badge"
								th:classappend="${v.estado == 'DISPONIBLE' ? 'bg-success' : (v.estado == 'ALQUILADO' ? 'bg-warning text-dark' : 'bg-danger')}"
								th:text="${v.estado}">DISPONIBLE</span>
						</td>
						<td class="text-center">
							<a th:href="@{/vehiculo/edicion/{id}(id=${v.idVehiculo})}"
								class="btn btn-sm btn-outline-primary me-1">
								<i class="fa-solid fa-pen"></i>
							</a>
							<form th:action="@{/vehiculo/cambiar-estado}" method="post" class="d-inline">
								<input type="hidden" name="id" th:value="${v.idVehiculo}" />
								<button type="submit" class="btn btn-sm btn-outline-secondary" title="Cambiar Estado">
									<i class="fa-solid fa-arrows-rotate"></i>
								</button>
							</form>
						</td>
					</tr>
					<tr th:if="${#lists.isEmpty(lstVehiculos)}">
						<td colspan="8" class="text-center text-muted py-3">No hay vehículos registrados.</td>
					</tr>
				</tbody>
			</table>
		</div>
	</div>
</div>
</body>

</html>
