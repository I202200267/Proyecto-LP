<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" th:replace="layouts/layout :: layoutBase(~{::contenido})">

<div th:fragment="contenido">
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0"><i class="fa-solid fa-pen-to-square me-2"></i>Actualizar Vehículo</h4>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/vehiculo/guardar}" th:object="${vehiculo}" method="post">
                            <input type="hidden" th:field="*{idVehiculo}" />

                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label for="placa" class="form-label">Placa:</label>
                                    <input type="text" id="placa" th:field="*{placa}" class="form-control" required />
                                </div>
                                <div class="col-md-6">
                                    <label for="categoria" class="form-label">Categoría:</label>
                                    <select id="categoria" th:field="*{categoria.idCategoria}" class="form-select" required>
                                        <option value="">-- Seleccione Categoría --</option>
                                        <option th:each="c : ${lstCategorias}" 
                                                th:value="${c.idCategoria}" 
                                                th:text="${c.nombre}"></option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label for="marca" class="form-label">Marca:</label>
                                    <input type="text" id="marca" th:field="*{marca}" class="form-control" required />
                                </div>
                                <div class="col-md-6">
                                    <label for="modelo" class="form-label">Modelo:</label>
                                    <input type="text" id="modelo" th:field="*{modelo}" class="form-control" required />
                                </div>
                                <div class="col-md-6">
                                    <label for="precioDiario" class="form-label">Precio Diario (S/):</label>
                                    <input type="number" step="0.01" id="precioDiario" th:field="*{precioDiario}" class="form-control" required />
                                </div>
                                <div class="col-md-6">
                                    <label for="estado" class="form-label">Estado:</label>
                                    <select id="estado" th:field="*{estado}" class="form-select" required>
                                        <option value="DISPONIBLE">DISPONIBLE</option>
                                        <option value="ALQUILADO">ALQUILADO</option>
                                        <option value="MANTENIMIENTO">MANTENIMIENTO</option>
                                    </select>
                                </div>
                            </div>

                            <div class="d-flex justify-content-end gap-2 mt-4">
                                <a th:href="@{/vehiculo/listado}" class="btn btn-secondary">
                                    <i class="fa-solid fa-arrow-left me-1"></i>Cancelar
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="fa-solid fa-floppy-disk me-1"></i>Actualizar Cambios
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</html>
