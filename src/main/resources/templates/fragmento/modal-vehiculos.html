<div th:fragment="modal-vehiculos(vehiculos, idModal)">
	<div class="modal fade" th:id="${idModal}" tabindex="-1">
		<div class="modal-dialog modal-dialog-centered modal-lg">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title">Seleccionar Vehículo</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
				</div>

				<div class="modal-body">
					<div class="table-responsive">
						<table id="tblSelectorVehiculos" class="table table-hover">
							<thead class="table-secondary">
								<tr>
									<th>Código</th>
									<th>Placa</th>
									<th>Modelo</th>
									<th>Precio Diario</th>
									<th>Acción</th>
								</tr>
							</thead>
							<tbody>
								<tr th:each="veh : ${vehiculos}">
									<td th:text="${veh.idVehiculo}"></td>
									<td th:text="${veh.placa}"></td>
									<td th:text="${veh.modelo}"></td>
									<td th:text="${veh.precioDiario}"></td>
									<td>
										<button type="button" class="btn btn-primary btnSeleccionarVehiculo"
											th:data-param1="${veh.idVehiculo}"
											th:data-param2="${veh.placa}" 
											th:data-param3="${veh.modelo}"
											th:data-param4="${veh.precioDiario}">
											Seleccionar
										</button>
									</td>
								</tr>
							</tbody>
						</table>
					</div>
				</div>
			</div>
		</div>
	</div>
	<!-- Script de inicialización -->
	<script>
		$(document).ready(function () {
			const idTabla = '#tblSelectorVehiculos';
			if ($.fn.DataTable.isDataTable(idTabla)) {
				$(idTabla).DataTable().destroy();
			}
			$(idTabla).DataTable({
				lengthMenu: [5, 10],
				pageLength: 5,
				language: {
					url: 'https://cdn.datatables.net/plug-ins/2.3.4/i18n/es-ES.json',
					search: "Filtrar :"
				}
			});
		});
	</script>
</div>
